name: test-unity-plugin

##############################################################################
# 1. Triggers
##############################################################################
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      projectPath: { required: true, type: string }
      unityVersion: { required: true, type: string }
      testMode: { required: true, type: string }
    secrets:
      UNITY_LICENSE: { required: true }
      UNITY_EMAIL: { required: true }
      UNITY_PASSWORD: { required: true }

##############################################################################
# 2. Job – runs only after a maintainer applies the `ci-ok` label
##############################################################################
jobs:
  # --------------------------------------------------------------------------- #
  # Version-consistency gate - secretless. Runs the a2 checker synced into this
  # repo (commands/check-versions.py) so version skew (the extension core pin vs
  # every packages-lock.json vs the vendored NuGet DLLs) becomes a RED build on
  # every PR. Design: unity-extensions-maintain f1 / 04-version-sync section 4.3.
  #
  # T1 supply-chain invariant (design 09-security): this job runs ONLY under plain
  # unprivileged `pull_request` (the caller trigger). It takes no credentials, reads
  # none, and needs none - the checker is offline and Python-stdlib only. Never move
  # it under `pull_request_target`.
  # --------------------------------------------------------------------------- #
  consistency:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version consistency
        run: python commands/check-versions.py .
  test:
    if: |
      github.event_name != 'pull_request_target' ||
      contains(github.event.pull_request.labels.*.name,'ci-ok')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        platform: [base, windows-mono]

    name: ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    steps:
      # --------------------------------------------------------------------- #
      # 2-a. (PR only) abort if the contributor also changed workflow files
      # --------------------------------------------------------------------- #
      - name: Abort if workflow files modified
        if: ${{ github.event_name == 'pull_request_target' }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only HEAD origin/${{ github.base_ref }} | grep -q '^\.github/workflows/'; then
            echo "::error::This PR edits workflow files – refusing to run with secrets"; exit 1;
          fi

      # --------------------------------------------------------------------- #
      # 2-b. Checkout the contributor’s commit safely
      # --------------------------------------------------------------------- #
      - uses: actions/checkout@v6
        with:
          lfs: false

      # --------------------------------------------------------------------- #
      # 2-c. Free disk space
      # --------------------------------------------------------------------- #
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # --------------------------------------------------------------------- #
      # 2-d. Cache & run the Unity test-runner
      # --------------------------------------------------------------------- #
      # Unity 6000.6+ legs skip the Library cache entirely (no restore, no save). A Library restored
      # from an earlier successful 6000.6 run gets the editor SIGKILLed (exit 137, "Killed") about 2s
      # after "Registering precompiled unity dll's", before any test runs, on both platforms; the same
      # legs pass from a cold Library. Older editors keep the cache exactly as before.
      - name: Library cache gate
        id: library_cache
        shell: bash
        env:
          UNITY_VERSION: ${{ inputs.unityVersion }}
        run: |
          IFS=. read -r major minor _ <<< "$UNITY_VERSION"
          if [ "$major" -lt 6000 ] || { [ "$major" -eq 6000 ] && [ "$minor" -lt 6 ]; }; then
            echo "use=true" >> "$GITHUB_OUTPUT"
          else
            # EXPERIMENT (exp/unity-6000.6-library-cache): cache re-enabled for 6000.6+ to find the root cause
            echo "use=true" >> "$GITHUB_OUTPUT"
            echo "Unity $UNITY_VERSION: EXPERIMENT - Library cache ENABLED for 6000.6+"
          fi

      - uses: actions/cache@v5
        id: lib_cache
        if: steps.library_cache.outputs.use == 'true'
        with:
          path: |
            ${{ inputs.projectPath }}/Library
            ~/.cache/unity3d
          key: ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}

      # A restored Library carries the PID files of the run that saved it. Unity 6000.6 reads
      # Library/burst.pid at startup and SIGKILLs that PID to reap a "stale" Burst compiler, but PIDs in a
      # fresh container are reused - often by one of the new editor's own threads - so the editor kills
      # itself (exit 137). Those files are never valid in a new container: drop them after the restore.
      - name: Drop stale PID files from the restored Library
        if: steps.library_cache.outputs.use == 'true'
        shell: bash
        run: rm -fv "${{ inputs.projectPath }}"/Library/burst.pid "${{ inputs.projectPath }}"/Library/ilpp.pid

      # --------------------------------------------------------------------- #
      # Unity 6000.6+ refuses to start its licensing client unless the container has >= 1 GiB of
      # /dev/shm ("Insufficient shared memory available - if using Docker, please run the container
      # with --shm-size=1025M"), and aborts batchmode with exit 134 on every activation retry.
      # Docker's default is 64 MiB and game-ci/unity-test-runner exposes no --shm-size input, so
      # raise the daemon-wide default on the host before the test-runner starts its container.
      # Older editors do not need it, so their legs are left exactly as they were.
      # --------------------------------------------------------------------- #
      - name: Raise Docker default shm-size (Unity 6000.6+)
        shell: bash
        env:
          UNITY_VERSION: ${{ inputs.unityVersion }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          IFS=. read -r major minor _ <<< "$UNITY_VERSION"
          if [ "$major" -lt 6000 ] || { [ "$major" -eq 6000 ] && [ "$minor" -lt 6 ]; }; then
            echo "Unity $UNITY_VERSION: default shm-size is sufficient, nothing to do"
            exit 0
          fi
          cfg=/etc/docker/daemon.json
          current='{}'
          [ -s "$cfg" ] && current="$(sudo cat "$cfg")"
          echo "$current" | jq '. + {"default-shm-size": "2G"}' | sudo tee "$cfg" > /dev/null
          sudo systemctl restart docker
          # Measure with the editor image the test-runner is about to pull anyway, so this adds no extra pull.
          image="unityci/editor:ubuntu-${UNITY_VERSION}-${PLATFORM}-3"
          shm="$(docker run --rm --entrypoint df "$image" -m /dev/shm | awk 'NR==2 {print $2}')"
          echo "container /dev/shm = ${shm} MiB"
          [ "$shm" -ge 1025 ] || { echo "::error::default-shm-size did not take effect (/dev/shm = ${shm} MiB)"; exit 1; }

      # --------------------------------------------------------------------- #
      - name: Generate custom image name
        id: custom_image
        run: echo "image=unityci/editor:ubuntu-${{ inputs.unityVersion }}-${{ matrix.platform }}-3" >> $GITHUB_OUTPUT
        shell: bash

      # --------------------------------------------------------------------- #
      # EXPERIMENT diagnostics: memory / shm / Library state + SIGKILL tracer
      # --------------------------------------------------------------------- #
      - name: "DIAG: before Unity + start samplers"
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.projectPath }}
        run: |
          set +e +o pipefail
          D="$RUNNER_TEMP/diag"; mkdir -p "$D"; echo "DIAG_DIR=$D" >> "$GITHUB_ENV"
          echo "cache-hit=${{ steps.lib_cache.outputs.cache-hit }}"
          nproc; free -m; df -h /dev/shm; cat /etc/docker/daemon.json 2>/dev/null || true
          if [ -d "$PROJECT_PATH/Library" ]; then
            du -sh "$PROJECT_PATH/Library"
            du -sh "$PROJECT_PATH"/Library/* 2>/dev/null | sort -h | tail -25
            [ -d "$PROJECT_PATH/Library/DataStore" ] && { du -sh "$PROJECT_PATH/Library/DataStore"; find "$PROJECT_PATH/Library/DataStore" -type f | wc -l; find "$PROJECT_PATH/Library/DataStore" -maxdepth 1 -type f -ls; }
            for f in "$PROJECT_PATH"/Library/*.pid "$PROJECT_PATH"/Library/*lock*; do [ -f "$f" ] && echo "$f: $(cat "$f" | head -c 200)"; done
            ls -la "$PROJECT_PATH/Library" | head -60
            find "$PROJECT_PATH/Library" -maxdepth 2 -iname '*lock*' -ls 2>/dev/null | head -20
          else
            echo "no Library (cold)"
          fi
          # kernel signal tracer: who sends SIGKILL/SIGBUS/SIGSEGV/SIGABRT/SIGTERM to whom
          T=/sys/kernel/tracing; [ -d "$T/events" ] || T=/sys/kernel/debug/tracing
          echo "TRACEFS=$T" >> "$GITHUB_ENV"
          sudo sh -c "echo 16384 > $T/buffer_size_kb; echo 'sig == 9 || sig == 6 || sig == 7 || sig == 11 || sig == 15' > $T/events/signal/signal_generate/filter; echo 1 > $T/events/signal/signal_generate/enable" || echo "tracefs unavailable"
          [ -d "$T/events/oom" ] && sudo sh -c "echo 1 > $T/events/oom/mark_victim/enable" || true
          # kill(2) arguments as the CALLER sees them (container-namespace pid) - links a kill to a pid file
          sudo sh -c "echo 'sig == 9' > $T/events/syscalls/sys_enter_kill/filter; echo 1 > $T/events/syscalls/sys_enter_kill/enable" || echo "sys_enter_kill unavailable"
          sudo dmesg -C || true
          # host memory / process sampler (1s) + docker stats / container shm sampler (2s)
          setsid nohup bash -c '
            while true; do
              echo "=== $(date -u +%T.%N | cut -c1-12)"
              free -m | sed -n 2,3p
              ps -eo pid,ppid,rss,vsz,etimes,stat,comm --sort=-rss | head -10
              sleep 1
            done' > "$D/mem-sampler.log" 2>&1 < /dev/null &
          setsid nohup bash -c '
            while true; do
              for c in $(docker ps -q); do
                echo "=== $(date -u +%T) $c"
                docker stats --no-stream --format "{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} {{.MemPerc}} pids={{.PIDs}}" "$c"
                docker exec "$c" sh -c "df -m /dev/shm | tail -1; ls -la /dev/shm | head -20" 2>&1
              done
              sleep 2
            done' > "$D/docker-sampler.log" 2>&1 < /dev/null &
          echo started
          exit 0

      - uses: game-ci/unity-test-runner@08fd329f00a18efa297140b14ac28ebce742759e # node24 runtime (PR #304); revert to @v4 once game-ci moves the tag
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          projectPath: ${{ inputs.projectPath }}
          unityVersion: ${{ inputs.unityVersion }}
          testMode: ${{ inputs.testMode }}
          customImage: ${{ steps.custom_image.outputs.image }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ inputs.unityVersion }} ${{ inputs.testMode }} ${{ matrix.platform }} Test Results
          artifactsPath: artifacts-${{ inputs.unityVersion }}-${{ inputs.testMode }}-${{ matrix.platform }}
          customParameters: -CI true -GITHUB_ACTIONS true

      - name: "DIAG: after Unity"
        if: always()
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.projectPath }}
        run: |
          set +e +o pipefail
          D="$DIAG_DIR"; pkill -f 'while true' || true
          free -m; df -h /dev/shm
          du -sh "$PROJECT_PATH/Library" 2>/dev/null || true
          du -sh "$PROJECT_PATH"/Library/* 2>/dev/null | sort -h | tail -25
          du -sh "$PROJECT_PATH/Library/DataStore" 2>/dev/null && find "$PROJECT_PATH/Library/DataStore" -maxdepth 1 -type f -ls
          for f in "$PROJECT_PATH"/Library/*.pid "$PROJECT_PATH"/Library/*lock*; do [ -f "$f" ] && echo "$f: $(cat "$f" | head -c 200)"; done
          echo "----- signal trace (sig 9/6/7/11/15) + kill(2) calls with sig 9"
          sudo cat "$TRACEFS/trace" > "$D/signals.log" 2>&1 || true
          grep -v '^#' "$D/signals.log" | tail -60 || true
          echo "----- dmesg"
          sudo dmesg -T > "$D/dmesg.log" 2>&1 || true
          tail -80 "$D/dmesg.log"
          grep -iE 'oom|killed process|out of memory' "$D/dmesg.log" || echo "no oom lines in dmesg"
          sudo journalctl -k --no-pager 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -20 || true
          echo "----- mem-sampler: peak used / min available"
          awk '/^Mem:/ {if ($3>u) u=$3; if (a==0 || $7<a) a=$7} END {print "peak used MiB=" u, "min available MiB=" a}' "$D/mem-sampler.log" || true
          grep -E 'mem=' "$D/docker-sampler.log" | tail -15 || true
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag ${{ inputs.unityVersion }} ${{ inputs.testMode }} ${{ matrix.platform }}
          path: ${{ env.DIAG_DIR }}

      # --------------------------------------------------------------------- #
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Test results for ${{ inputs.unityVersion }} ${{ inputs.testMode }} on ${{ matrix.platform }}
          path: ${{ steps.tests.outputs.artifactsPath }}

      # --------------------------------------------------------------------- #
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.tests.outputs.artifactsPath }}/**/*.xml
          check_name: ${{ inputs.unityVersion }} ${{ inputs.testMode }} ${{ matrix.platform }} Results
          comment_mode: failures
          # Disable build-over-build comparison: it triggers a paginated GET on
          # /repos/{owner}/{repo}/commits/{before_sha}/check-runs that
          # intermittently returns 401 ("Bad credentials") even with valid
          # GITHUB_TOKEN + correct permissions. The first probe call with
          # per_page=1 succeeds; the immediately following per_page=100 fetch
          # 401s on the same URL with the same token. Disabling compare_to_
          # earlier_commit skips the problematic call entirely. We lose the
          # build-delta annotation in the published check run but keep the
          # core pass/fail signal. Revisit when GitHub fixes the upstream
          # pagination flake.
          compare_to_earlier_commit: false
