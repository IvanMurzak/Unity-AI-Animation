name: test-pull-request

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  test-unity-6000-6-3f1-editmode:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.6.3f1"
      unityVersion: "6000.6.3f1"
      testMode: "editmode"
    secrets: inherit

  # --- PLAY MODE ---

  test-unity-6000-6-3f1-playmode:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.6.3f1"
      unityVersion: "6000.6.3f1"
      testMode: "playmode"
    secrets: inherit

  # --- STANDALONE ---

  test-unity-6000-6-3f1-standalone:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.6.3f1"
      unityVersion: "6000.6.3f1"
      testMode: "standalone"
    secrets: inherit

  # -------------------
